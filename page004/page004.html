<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="style004.css">

</head>
<body style="background-image: url('../img/back1.png'); background-size: cover;">
    
    <a class="link-voltar" href="../index.html"><img src="../img/voltaricon.png" alt="Voltar para a página inicial" width="100"></a>
    <div class="form-container">
        <h1>Formulário de Comissão</h1>
        
      
        <form action="https://formsubmit.co/cauaalvarino@gmail.com" method="POST">
            
        
            <div class="form-group">
                <label for="nome">Nome completo:</label>
                <input type="text" id="nome" name="Nome" required placeholder="Digite seu nome completo">
            </div>

           
            <div class="form-group">
                <label for="telefone">Telefone:</label>
                <input type="tel" id="telefone" name="Telefone" required placeholder="(XX) XXXXX-XXXX">
            </div>

            
            <div class="form-group">
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="Email" required placeholder="seuemail@exemplo.com">
            </div>

            
            <div class="form-group">
                <label>Você é:</label>
                <div class="opcoes-inline">
                    <input type="radio" id="pf" name="Tipo_Pessoa" value="Pessoa Física" required>
                    <label for="pf" class="label-inline">Pessoa Física</label>

                    <input type="radio" id="pj" name="Tipo_Pessoa" value="Pessoa Jurídica" required>
                    <label for="pj" class="label-inline">Pessoa Jurídica</label>
                </div>
            </div>

           
            <div class="form-group">
                <label>Melhor horário para contato (marque um ou mais):</label>
                <div class="opcoes-inline">
                    <input type="checkbox" id="manha" name="Horario_Contato_Manha" value="Sim">
                    <label for="manha" class="label-inline">Manhã</label>

                    <input type="checkbox" id="tarde" name="Horario_Contato_Tarde" value="Sim">
                    <label for="tarde" class="label-inline">Tarde</label>

                    <input type="checkbox" id="noite" name="Horario_Contato_Noite" value="Sim">
                    <label for="noite" class="label-inline">Noite</label>
                </div>
            </div>

           
            <div class="form-group">
                <label for="servico">Qual o tipo de serviço que deseja?</label>
                <select id="servico" name="Servico_Desejado" required>
                    <option value="" disabled selected>Selecione uma opção...</option>
                    <option value="Consultoria">Consultoria</option>
                    <option value="Desenvolvimento Web">Desenvolvimento Web</option>
                    <option value="Design Gráfico">Design Gráfico</option>
                    <option value="Manutenção">Manutenção</option>
                    <option value="Outro">Outro</option>
                </select>
            </div>

            
            <div class="form-group">
                <label for="descricao">Breve descrição do que deseja contratar:</label>
                <textarea id="descricao" name="Descricao" rows="5" required placeholder="Escreva aqui os detalhes do projeto ou serviço que você precisa..."></textarea>
            </div>

           
            <input type="hidden" name="_subject" value="Novo formulário de contato recebido!">
         
            <input type="hidden" name="_captcha" value="false"> 
    
            <input type="hidden" name="_next" value="">

            <button type="submit" class="btn-enviar">Enviar Solicitação</button>
        </form>
    </div>
    </body>
</html>
